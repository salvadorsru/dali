  <text x="64" y="320" font-family="JetBrains Mono, monospace" font-size="17" fill="#a1a5a9">Dalí parses Figma `.fig` files on disk, builds a</text>
  <text x="64" y="346" font-family="JetBrains Mono, monospace" font-size="17" fill="#a1a5a9">rebuildable local SQLite index (full-text, structural and</text>
